services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devboard}
      POSTGRES_DB: ${POSTGRES_DB:-devboard}
    # La BD no se expone al host. Para acceder: docker compose exec db psql -U devboard devboard
    volumes:
      - devboard_pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5439:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-devboard} -d ${POSTGRES_DB:-devboard}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-devboard}:${POSTGRES_PASSWORD:-devboard}@db:5432/${POSTGRES_DB:-devboard}
    ports:
      - '8092:8092'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:8092/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  devboard_pgdata:
